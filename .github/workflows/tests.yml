# =====================================================
# The suite, run where the person who forgot cannot reach it
# =====================================================
# Until 2026-09-03 every check in this repository ran only when somebody typed
# `npm test`. There was no CI and no hook, so the privacy guards — no personal
# name, no absolute path, no image metadata, no tracked process record — were
# enforced by habit.
#
# WHAT THIS IS, AND WHAT IT IS NOT
#
#   This is the enforcement half. The `pre-push` hook in `.githooks/` is the
#   other half and it is NOT enforcement: it does not survive a clone, and
#   `git push --no-verify` skips it. This runs on the server, on every push and
#   every pull request, and cannot be skipped from a developer's machine.
#
#   **It catches a mistake AFTER the push, not before it.** By the time this job
#   turns red, the commit is on GitHub and, if the repository is public, it has
#   been fetchable by anyone and may already be indexed. For a name, a path or a
#   photograph's metadata that is not a near miss — publication has happened and
#   the fix is a history rewrite plus whatever disclosure that deserves.
#
#   So do not read a green tick as proof that nothing was ever published. Read
#   it as proof that nothing is published *now*. The control that actually
#   prevents disclosure is upstream of both: not writing the name, the path or
#   the process record into the repository in the first place.
#
# THIS FILE IS CANONICAL for both repositories (supplement 2, item C), and so is
# its FILENAME: `.github/workflows/tests.yml`, in both. It was `test.yml` here
# and `guards.yml` there, which is one job under two names in the first place a
# person looks — the same drift the reconciliation exists to stop.
#
# `tests` rather than `guards` because the job runs the whole suite plus `tsc`
# and the build, not only the disclosure guards, and somebody whose build broke
# would not think to look in a file called `guards`. The filename matches the
# `name:` below deliberately, so the tab in the Actions UI and the file on disk
# agree.
#
# THE TWO COPIES ARE BYTE-IDENTICAL. Nothing checks that mechanically yet, so
# it holds only as long as a change here is made in both. Every statement below is written to be true in both repositories; where the two
# differ in fact, the comment names each one rather than letting one copy say
# something the other contradicts. Until 2026-09-25 they had drifted: each
# copy's header claimed the other installed differently, and each described
# its own suite in words that had stopped being true
# (WORKORDER_AM_HWK_CHECKS_ARE_DEAD_2026-09-25, Supplement 2, item 4).
#
# Both repositories track `package-lock.json` and install with `npm ci`, with
# the npm cache keyed on it. Any difference between the two files is drift.
name: tests

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer stale, and a
# stale green tick is worse than no tick.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This job inspects the tree; it has no business writing to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guards read `git ls-files`, which needs the working tree and
          # nothing else, so a shallow fetch is enough. They scan the tree as it
          # stands, never its history — history is a separate, authorised
          # question and not this job's business.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # THE LOCKFILE IS TRACKED, and this installs exactly what it records.
      #
      # The Assignment Maker's step used to be `npm install`, on the claim that
      # `package.json` pinned what mattered. Its CI run 22 (2026-09-24) disproved
      # it: `katex` is a caret range, the runner resolved a newer patch than the
      # machine that wrote the byte-for-byte goldens, and the two HTML documents
      # that embed KaTeX differed. So a dependency update is a deliberate act in
      # both repositories: a change to `package-lock.json` that somebody made and
      # CI saw. (WORKORDER_AM_GENERIC_ANSWER_PAGE_2026-09-24_SUPPLEMENT_1, item 2.)
      - run: npm ci

      # tsc, then `npm test`, then the build. `npm test` runs the suites its own
      # `package.json` lists; they are not enumerated here, because the list
      # here went stale in both copies.
      #
      # WHAT A GREEN RUN HERE DOES NOT COVER. This job checks out ONE repository
      # and nothing beside it, so some checks cannot run here. They are covered
      # locally, where the material is:
      #
      #   Assignment Maker. Ten checks read the real ENG17 homeworks, which live
      #   outside the repository: six in templateTests (layout ids, region
      #   counts, answer-key leak) and four in figure-extract / figure-swap-e2e.
      #   Here they SKIP. Locally they run from a default path beside the
      #   checkout, or from ENG17_HWK_DIR / GB_ENG17_DIR, and with either set a
      #   missing file FAILS. Also skipped here: five cross-repository checks
      #   and the committed-sample check, which need the Student Submission
      #   repository or the GradeBridge2026 record beside this one. `npm test`
      #   ends by listing every skipped check by name, and a suite that runs no
      #   checks at all fails.
      #
      #   Student Submission. Twenty-five of the forty-one labelled photographs
      #   are other people's coursework and are not in the repository, so
      #   `gate-tests.mjs` prints a SKIP naming each and asserts exact agreement
      #   over the sixteen that are tracked. A green run here covers the sixteen,
      #   not the forty-one; locally all forty-one run (checked 2026-09-25: 41 on
      #   disk, 0 skipped).
      #
      # Until 2026-09-25 the Assignment Maker's copy said its ENG17 checks were
      # "covered locally, where the files are". They were not: a stale filename
      # made them skip everywhere. A claim that something is covered elsewhere
      # is only as good as the last time somebody watched it run there.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
